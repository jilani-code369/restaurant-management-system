<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Manager (CRUD)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-50 min-h-screen p-6 sm:p-12">

    <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <div class="flex justify-between items-center border-b border-gray-200 pb-4 mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Category Manager</h1>
            <button onclick="openModal('add')" class="bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-4 rounded transition duration-200 cursor-pointer">
                + Add Category
            </button>
        </div>

        <div id="loading" class="text-center py-4 text-gray-500 font-medium hidden">Loading...</div>
        <div id="error" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded mb-4">
            <strong class="font-bold">Error:</strong> <span id="error-message"></span>
        </div>

        <div id="table-container" class="hidden overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-20">ID</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                        <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider w-40">Actions</th>
                    </tr>
                </thead>
                <tbody id="category-rows" class="bg-white divide-y divide-gray-200">
                    </tbody>
            </table>
        </div>
        
        <div id="empty-state" class="hidden text-center py-8 text-gray-500">
            No categories found. Click "+ Add Category" to create one.
        </div>
    </div>

    
    <div id="form-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-md w-full p-6">
            <h3 id="modal-title" class="text-xl font-bold text-gray-800 mb-4">Add Category</h3>
            <form id="category-form" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="category-id">
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="category-name">Category Name</label>
                    <input type="text" id="category-name" required class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="flex justify-end space-x-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border border-gray-300 text-gray-700 rounded hover:bg-gray-100 cursor-pointer">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 cursor-pointer">Save</button>
                </div>
            </form>
        </div>
    </div>


    <script>
        const API_URL = 'http://127.0.0.1:9000/api/v1/category/';
        let currentModalMode = 'add'; // 'add' or 'edit'

        // --- READ: Fetch and display categories ---
        async function fetchCategories() {
            showState('loading');
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const data = await response.json();
                
                // DRF Fallback: handling both paginated structures and plain lists
                let categoriesArray = [];
                if (data && Array.isArray(data.results)) {
                    categoriesArray = data.results;
                } else if (Array.isArray(data)) {
                    categoriesArray = data;
                }

                if (categoriesArray.length === 0) {
                    showState('empty');
                    return;
                }

                const tableBodyEl = document.getElementById('category-rows');
                tableBodyEl.innerHTML = '';

                categoriesArray.forEach(category => {
                    const row = document.createElement('tr');
                    row.className = "hover:bg-gray-50 transition duration-150";
                    row.innerHTML = `
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${category.id}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">${category.name}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-right font-medium space-x-2">
                            <button onclick="openEditModal(${category.id}, '${category.name.replace(/'/g, "\\'")}')" class="text-blue-600 hover:text-blue-900 cursor-pointer">Edit</button>
                            <button onclick="deleteCategory(${category.id})" class="text-red-600 hover:text-red-900 cursor-pointer">Delete</button>
                        </td>
                    `;
                    tableBodyEl.appendChild(row);
                });

                showState('table');
            } catch (error) {
                showError(error.message);
            }
        }

        // --- CREATE and UPDATE: Handle form submission ---
        async function handleFormSubmit(event) {
            event.preventDefault();
            const id = document.getElementById('category-id').value;
            const name = document.getElementById('category-name').value;
            
            // Ensure trailing slash structure matches typical DRF router patterns
            const url = currentModalMode === 'add' ? API_URL : `${API_URL}${id}/`;
            const method = currentModalMode === 'add' ? 'POST' : 'PUT';

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name })
                });

                if (!response.ok) {
                    const errPayload = await response.json().catch(() => ({}));
                    const reason = errPayload.detail || JSON.stringify(errPayload) || `Status: ${response.status}`;
                    throw new Error(`Failed to save. Backend says: ${reason}`);
                }
                
                closeModal();
                fetchCategories(); 
            } catch (error) {
                alert("Error saving category: " + error.message);
            }
        }

        // --- DELETE: Remove category with descriptive error debugging ---
        async function deleteCategory(id) {
            if (!confirm("Are you sure you want to delete this category?")) return;

            try {
                // Sent with trailing slash explicitly
                const response = await fetch(`${API_URL}${id}/`, { method: 'DELETE' });
                
                if (!response.ok) {
                    // Pull explicit payload from DRF validation/exception layer
                    const errorData = await response.json().catch(() => ({}));
                    const reason = errorData.detail || JSON.stringify(errorData) || `HTTP status: ${response.status}`;
                    throw new Error(`Deletion rejected by server. Reason: ${reason}`);
                }
                
                fetchCategories(); 
            } catch (error) {
                showError(error.message);
            }
        }

        // --- Modal Helpers ---
        function openModal(mode) {
            currentModalMode = mode;
            document.getElementById('category-form').reset();
            document.getElementById('modal-title').innerText = mode === 'add' ? 'Add Category' : 'Edit Category';
            document.getElementById('form-modal').classList.remove('hidden');
        }

        function openEditModal(id, name) {
            openModal('edit');
            document.getElementById('category-id').value = id;
            document.getElementById('category-name').value = name;
        }

        function closeModal() {
            document.getElementById('form-modal').classList.add('hidden');
        }

        // --- Layout Visibility States Manager ---
        function showState(state) {
            document.getElementById('loading').classList.toggle('hidden', state !== 'loading');
            document.getElementById('error').classList.add('hidden');
            document.getElementById('table-container').classList.toggle('hidden', state !== 'table');
            document.getElementById('empty-state').classList.toggle('hidden', state !== 'empty');
        }

        function showError(message) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('table-container').classList.add('hidden');
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('error-message').innerText = message;
            document.getElementById('error').classList.remove('hidden');
        }

        // Initial fetch on application load
        document.addEventListener('DOMContentLoaded', fetchCategories);
    </script>
</body>
</html>
